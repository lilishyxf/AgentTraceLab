services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agenttrace:agenttrace@postgres:5432/agenttrace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agenttrace
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace -d agenttrace"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agenttrace-postgres:/var/lib/postgresql/data

volumes:
  agenttrace-postgres:
